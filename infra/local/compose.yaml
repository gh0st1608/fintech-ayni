# Emulador AWS para el ambiente dev (ADR, docs/architecture.md). floci es MIT y no pide cuenta.
# Uso: docker compose -f infra/local/compose.yaml up -d  (ver infra/terraform/README.md)
name: ayni-local

services:
  floci:
    # Versión fijada: subirla después de probar el stack dev con la nueva.
    image: floci/floci:2.2.0
    ports:
      - "127.0.0.1:4566:4566"
      # Proxies de RDS: cada instancia de PostgreSQL recibe un puerto de este rango.
      - "127.0.0.1:7001-7099:7001-7099"
    volumes:
      # ECS, RDS y ECR levantan contenedores reales (la API, PostgreSQL, el registry).
      - /var/run/docker.sock:/var/run/docker.sock
      - floci-data:/var/lib/floci
    environment:
      FLOCI_DEFAULT_REGION: us-east-1
      # El estado sobrevive a reinicios: tiene que coincidir con el estado local de Terraform.
      FLOCI_STORAGE_MODE: hybrid
      FLOCI_STORAGE_PERSISTENT_PATH: /var/lib/floci
      # La misma versión mayor que prd (ADR: PostgreSQL 17).
      FLOCI_SERVICES_RDS_DEFAULT_POSTGRES_IMAGE: postgres:17.6-alpine
      # Los endpoints de RDS apuntan al puerto publicado en esta máquina.
      FLOCI_SERVICES_RDS_ENDPOINT_HOST: localhost
      # ECR como localhost:4566/<cuenta>/<región>/<repo>: Docker Desktop en Windows no resuelve
      # *.localhost, y localhost es un registry inseguro permitido sin configurar el daemon.
      FLOCI_SERVICES_ECR_URI_STYLE: path
      # La consola web usa una imagen sin versión fija: apagada.
      FLOCI_SERVICES_UI_ENABLED: "false"

  # Perfil "tunnel": la app en un teléfono llega a la API local por ngrok (docs/dev-environment.md).
  #   docker compose -f infra/local/compose.yaml --profile tunnel up -d
  gateway:
    image: caddy:2.11.6-alpine
    profiles: [tunnel]
    volumes:
      - ./gateway/Caddyfile:/etc/caddy/Caddyfile:ro
    environment:
      DOCUMENTS_BUCKET: ${DOCUMENTS_BUCKET:-ayni-local-documents}
    ports:
      # Para probar el gateway sin el túnel: http://localhost:8080/health/live
      - "127.0.0.1:8080:8080"
    # La API corre en la máquina; en Linux este alias no existe sin host-gateway.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - floci

  ngrok:
    image: ngrok/ngrok:3.39.11-alpine
    profiles: [tunnel]
    # Se valida al arrancar y no al leer el archivo: compose interpola todos los servicios aunque el
    # perfil no esté activo, y el `up` de floci no debe exigir las variables de ngrok.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        [ -n "$$NGROK_AUTHTOKEN" ] && [ -n "$$NGROK_URL" ]
        || { echo 'Configura NGROK_AUTHTOKEN y NGROK_URL en infra/local/.env' >&2; exit 1; };
        exec ngrok http gateway:8080 --url="$$NGROK_URL"
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
      NGROK_URL: ${NGROK_URL:-}
    ports:
      # Inspector de peticiones del túnel: http://localhost:4040
      - "127.0.0.1:4040:4040"
    depends_on:
      - gateway

volumes:
  floci-data:
