# Validaciones obligatorias de cada cambio (COPAYNI-9). Los nombres de los jobs son los checks
# que exige la protección de la rama main: no renombrarlos sin actualizarla.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Solo lectura: ningún job publica ni despliega.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commitlint:
    name: commitlint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts
      - name: Conventional Commits en los commits del PR
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: npx commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

  secrets:
    name: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Revisa todo el historial. --redact: si encuentra algo, el log no muestra el valor.
      - name: gitleaks
        run: >
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1
          git /repo --redact --verbose --exit-code 1

  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/backend
    # Las pruebas de integración y e2e usan PostgreSQL real, la misma versión que RDS y que
    # compose.yaml, y floci para S3. Credenciales solo de prueba (test/setup-env.ts).
    services:
      postgres:
        image: postgres:17.6-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: ayni
          POSTGRES_PASSWORD: ayni
          POSTGRES_DB: ayni_test
        options: >-
          --health-cmd "pg_isready -U ayni -d ayni_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      # Emulador de AWS: las pruebas del SDK (S3 de documentos, COPAYNI-43) nunca llegan a AWS.
      floci:
        image: floci/floci:2.2.0
        ports:
          - 4566:4566
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: floci listo
        run: |
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:4566/_localstack/health > /dev/null && exit 0
            sleep 2
          done
          echo "floci no respondió" && exit 1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: apps/backend/.nvmrc
          cache: npm
          cache-dependency-path: apps/backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      # Unitarias, integración y e2e, con umbral de cobertura del 90%.
      - run: npm run test:cov
      - run: npm run build
      - name: Vulnerabilidades altas o críticas
        run: node ../../scripts/check-audit.mjs
      - name: Reporte de cobertura
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-backend
          path: apps/backend/coverage
          retention-days: 14
          if-no-files-found: ignore

  # Infraestructura como código (COPAYNI-12). Sin credenciales: nada de esto llega a AWS.
  infra:
    name: infra
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: infra/terraform
    env:
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform-plugin-cache
      TF_IN_AUTOMATION: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.13.0
          terraform_wrapper: false
      - run: mkdir -p "$TF_PLUGIN_CACHE_DIR"
      - run: terraform fmt -check -recursive -diff
      # Módulos: validate y pruebas con provider simulado. Stacks: validate (y las pruebas de prd).
      - name: validate y terraform test
        run: |
          for dir in modules/*/ live/*/*/*/ bootstrap/; do
            echo "::group::$dir"
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
            if [ -d "$dir/tests" ]; then terraform -chdir="$dir" test; fi
            echo "::endgroup::"
          done
      - name: tflint
        run: >
          docker run --rm -v "$PWD:/data" -w /data --entrypoint sh
          ghcr.io/terraform-linters/tflint:v0.64.0
          -c 'tflint --init --config /data/.tflint.hcl && tflint --recursive --config /data/.tflint.hcl'
      - name: checkov
        run: >
          docker run --rm -v "$PWD:/tf" -w /tf bridgecrew/checkov:3.3.28
          --config-file /tf/.checkov.yaml -d /tf
      - name: La imagen de la API compila
        working-directory: apps/backend
        run: docker build --tag ayni-api:ci .

  mobile:
    name: mobile
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: apps/mobile/.nvmrc
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      # lint (con límites entre capas), typecheck, format:check y pruebas con cobertura.
      - run: npm run validate
      - name: Configuración de Expo
        run: |
          npx expo-doctor
          npx expo install --check
      - name: El bundle compila
        run: npx expo export --platform android --platform ios --output-dir "$RUNNER_TEMP/expo-export"
      - name: Vulnerabilidades altas o críticas
        run: node ../../scripts/check-audit.mjs
      - name: Reporte de cobertura
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-mobile
          path: apps/mobile/coverage
          retention-days: 14
          if-no-files-found: ignore
