name: API QA

# Regresión de la API con la colección Postman (qa/api) contra el backend real, con PostgreSQL y
# floci. Sin credenciales: la pasarela, el KYC y el OTP son los de desarrollo.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  newman:
    name: newman (dev)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.6-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: ayni
          POSTGRES_PASSWORD: ayni
          POSTGRES_DB: ayni
        options: >-
          --health-cmd "pg_isready -U ayni -d ayni"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      floci:
        image: floci/floci:2.2.0
        ports:
          - 4566:4566
    env:
      # La API como en docs/dev-environment.md, con los documentos en floci.
      DOCUMENT_STORAGE: s3
      DOCUMENTS_BUCKET: ayni-local-documents
      DOCUMENTS_S3_ENDPOINT: http://127.0.0.1:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      # La colección hace ~170 peticiones en menos de un minuto desde una sola IP.
      RATE_LIMIT_MAX: '5000'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: floci listo
        run: |
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:4566/_localstack/health > /dev/null && exit 0
            sleep 2
          done
          echo "floci no respondió" && exit 1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: apps/backend/.nvmrc
          cache: npm
          cache-dependency-path: |
            apps/backend/package-lock.json
            qa/api/package-lock.json

      - name: Backend
        working-directory: apps/backend
        run: |
          npm ci
          cp .env.example .env
          npm run build
          npm run dev:documents-bucket
          node dist/migrate.js
          nohup node dist/main.js > "$RUNNER_TEMP/api.log" 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:3000/health/ready > /dev/null && exit 0
            sleep 2
          done
          echo "La API no respondió" && cat "$RUNNER_TEMP/api.log" && exit 1

      - name: La colección generada está al día
        working-directory: qa/api
        run: |
          npm ci
          npm run build
          git diff --exit-code -- collections docs/traceability-matrix.md

      - name: Newman
        working-directory: qa/api
        run: npm run test:dev -- --env-var baseUrl=http://127.0.0.1:3000

      - name: Vulnerabilidades altas o críticas (qa/api)
        working-directory: qa/api
        run: node ../../scripts/check-audit.mjs

      - name: Reportes y log de la API
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: api-qa-reports
          path: |
            qa/api/reports
            ${{ runner.temp }}/api.log
          retention-days: 14
          if-no-files-found: ignore
