# PostgreSQL para desarrollo y pruebas, misma versión mayor que RDS (ADR 2).
# Uso: npm run db:up. Credenciales solo locales; crea las bases ayni (dev) y ayni_test.
# DB_PORT elige el puerto publicado, por si el 5432 ya lo ocupa otro proyecto en la misma máquina:
# `DB_PORT=55433 npm run db:up`, y las pruebas con el mismo DB_PORT (test/setup-env.ts).
name: ayni-backend

services:
  postgres:
    image: postgres:17.6-alpine
    ports:
      - '127.0.0.1:${DB_PORT:-5432}:5432'
    environment:
      POSTGRES_USER: ayni
      POSTGRES_PASSWORD: ayni
      POSTGRES_DB: ayni
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./test/support/create-test-database.sql:/docker-entrypoint-initdb.d/create-test-database.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ayni -d ayni']
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
